[package]
name = "caddy-dashboard"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-files = "0.6.10"
actix-web = "4.13.0"
argon2 = "0.5"
rand = "0.8"
chrono = { version = "0.4.44", features = ["serde"] }
futures-util = "0.3"
log = { version = "0.4.29", features = ["std"] }
miette = "7.6.0"
redb = "4.0.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
maxminddb = "0.24"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
urlencoding = "2.1"
simplelog = "0.12.2"

[dependencies.tokio]
version = "1.51.1"
features = ["macros", "rt-multi-thread", "time", "sync"]

[build-dependencies]
flate2 = "1"
ureq = "3"
